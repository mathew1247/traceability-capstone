<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-laptop-layout">
    <!-- Top Orange/Coral Topographic Section -->
    <header class="laptop-topo-header form-header" style="min-height: 28vh;">
      <!-- Top Brand Navigation Bar -->
      <div class="topo-brand-bar">
        <a href="welcome.html" class="topo-brand-logo">
          <div class="topo-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span>Sentinel-Trace</span>
        </a>
        <div class="topo-system-pill">
          New Operator Enrollment
        </div>
      </div>

      <!-- Topographic Contour Lines SVG -->
      <svg class="laptop-topo-svg" viewBox="0 0 1440 240" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.6">
        <path d="M-100,60 C300,120 600,20 1000,80 C1200,110 1400,50 1540,70" />
        <ellipse cx="720" cy="90" rx="360" ry="60" stroke="rgba(255,255,255,0.32)" />
      </svg>

      <!-- Organic Wave at the Middle -->
      <div class="laptop-wave-middle">
        <svg viewBox="0 0 1440 90" preserveAspectRatio="none">
          <path d="M 0,35 C 380,95 740,-15 1100,45 C 1260,75 1380,50 1440,40 L 1440,90 L 0,90 Z" fill="#ffffff"></path>
        </svg>
      </div>
    </header>

    <!-- Bottom Clean White Section -->
    <main class="laptop-white-body">
      <div class="form-laptop-card wide-mode">
        <h1 class="auth-form-title">Sign up</h1>
        <div class="auth-title-bar"></div>

        <form id="register-form">
          <div class="auth-grid-2col">
            <!-- Full Name Field -->
            <div class="auth-form-group">
              <label class="auth-input-label" for="reg-username">Full Name</label>
              <div class="auth-input-field-wrapper">
                <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="reg-username" class="auth-minimal-input" placeholder="Jack Mathew" required>
              </div>
            </div>

            <!-- Email Field -->
            <div class="auth-form-group">
              <label class="auth-input-label" for="reg-email">Work Email</label>
              <div class="auth-input-field-wrapper">
                <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
                <input type="email" id="reg-email" class="auth-minimal-input" placeholder="name@sentineltrace.io" required>
              </div>
            </div>

            <!-- System Role Field -->
            <div class="auth-form-group auth-grid-full">
              <label class="auth-input-label" for="reg-role">System Role & Permissions</label>
              <div class="auth-input-field-wrapper">
                <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <select id="reg-role" class="auth-minimal-input" style="cursor: pointer;" required>
                  <option value="Admin">Administrator (Full Control & Users)</option>
                  <option value="Inspector">Quality Inspector (QA, Batches & Releases)</option>
                  <option value="Auditor">Compliance Auditor (ISO / GMP / RoHS Audits)</option>
                  <option value="Operator">Shopfloor Operator (Batch Execution & Materials)</option>
                </select>
              </div>
            </div>

            <!-- Password Field -->
            <div class="auth-form-group">
              <label class="auth-input-label" for="reg-password">Password</label>
              <div class="auth-input-field-wrapper">
                <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="reg-password" class="auth-minimal-input" placeholder="create password" required>
              </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="auth-form-group">
              <label class="auth-input-label" for="reg-confirm-password">Confirm Password</label>
              <div class="auth-input-field-wrapper">
                <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="reg-confirm-password" class="auth-minimal-input" placeholder="repeat password" required>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-coral-pill" id="register-btn" style="margin-top: 14px;">
            Sign up
          </button>
        </form>

        <!-- Sign In Switch Link -->
        <div class="auth-bottom-switch-link">
          Already have an Account ? <a href="login.html" class="auth-link-coral">Sign in</a>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
