<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Batches | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="header-mount"></div>

      <div class="app-content">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Production Batches</h1>
            <p class="page-subtitle">Manage shop floor execution lots, raw material consumption, and QA clearances.</p>
          </div>
          <div class="page-actions-group">
            <button class="btn btn-primary btn-sm" onclick="openModal('add-batch-modal')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Create Batch
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-search-box">
              <svg class="table-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" class="table-search-input" id="batch-search" placeholder="Search batch ID or product..." onkeyup="filterBatches()">
            </div>
            <div class="table-filters-group">
              <select class="table-filter-select" id="batch-status-filter" onchange="filterBatches()">
                <option value="">All Batch States</option>
                <option value="Completed">Completed</option>
                <option value="In QA Inspection">In QA Inspection</option>
                <option value="Passed">Passed</option>
                <option value="Running">Running</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Batch ID</th>
                  <th>Product</th>
                  <th>Raw Material Consumed</th>
                  <th>Quantity</th>
                  <th>Production Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="batches-table-body">
                <!-- Injected via batches.js -->
              </tbody>
            </table>
          </div>
          <div class="table-pagination" id="batches-pagination">
            <span id="batches-pagination-info">Showing active production batches</span>
            <div class="table-pagination-group">
              <div class="pagination-page-size">
                <label for="batches-page-size">Rows per page:</label>
                <select id="batches-page-size" class="pagination-size-select">
                  <option value="5">5</option>
                  <option value="10" selected>10</option>
                  <option value="25">25</option>
                  <option value="50">50</option>
                </select>
              </div>
              <div class="pagination-controls">
                <button type="button" class="pagination-btn" id="batches-prev-btn" disabled>&laquo; Prev</button>
                <div class="pagination-pages" id="batches-page-numbers"></div>
                <button type="button" class="pagination-btn" id="batches-next-btn" disabled>Next &raquo;</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create Batch Modal -->
  <div class="modal-overlay" id="add-batch-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Initiate Production Batch</h3>
        <button class="modal-close" onclick="closeModal('add-batch-modal')">&times;</button>
      </div>
      <form id="add-batch-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">Target Product <span class="required">*</span></label>
              <select id="batch-product" class="form-select" required>
                <option value="" disabled selected>Select a product...</option>
              </select>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Allocated Raw Material <span class="required">*</span></label>
              <select id="batch-material" class="form-select" required>
                <option value="" disabled selected>Select raw material...</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Lot Quantity (Units) <span class="required">*</span></label>
              <input type="number" id="batch-qty" class="form-input" value="350" required>
            </div>
            <div class="form-group">
              <label class="form-label">Initial State</label>
              <select id="batch-status" class="form-select">
                <option value="Running">Running</option>
                <option value="Pending">Pending</option>
                <option value="In QA Inspection">In QA Inspection</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('add-batch-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Start Batch</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Batch Modal -->
  <div class="modal-overlay" id="edit-batch-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Edit Production Batch</h3>
        <button class="modal-close" onclick="closeModal('edit-batch-modal')">&times;</button>
      </div>
      <form id="edit-batch-form">
        <input type="hidden" id="edit-batch-id">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">Target Product <span class="required">*</span></label>
              <select id="edit-batch-product" class="form-select" required>
              </select>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Allocated Raw Material <span class="required">*</span></label>
              <select id="edit-batch-material" class="form-select" required>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Lot Quantity (Units) <span class="required">*</span></label>
              <input type="number" id="edit-batch-qty" class="form-input" required min="1">
            </div>
            <div class="form-group">
              <label class="form-label">Production Status</label>
              <select id="edit-batch-status" class="form-select">
                <option value="Running">Running</option>
                <option value="Pending">Pending</option>
                <option value="In QA Inspection">In QA Inspection</option>
                <option value="Completed">Completed</option>
                <option value="Passed">Passed</option>
                <option value="Quarantined">Quarantined</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('edit-batch-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pagination-component.js"></script>
  <script src="js/batches.js"></script>
</body>
</html>
