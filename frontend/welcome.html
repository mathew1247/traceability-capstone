<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-laptop-layout">
    <!-- Top Orange/Coral Topographic Section -->
    <header class="laptop-topo-header welcome-header">
      <!-- Top Brand Navigation Bar -->
      <div class="topo-brand-bar">
        <div class="topo-brand-logo">
          <div class="topo-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span>Sentinel-Trace</span>
        </div>
        <div class="topo-system-pill">
          Industrial Intelligence Platform
        </div>
      </div>

      <!-- Topographic Contour Curves SVG -->
      <svg class="laptop-topo-svg" viewBox="0 0 1440 400" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.6">
        <path d="M-100,100 C300,180 600,40 1000,120 C1200,160 1400,80 1540,110" />
        <path d="M-100,160 C320,240 620,100 1020,180 C1220,220 1420,140 1540,170" />
        <path d="M-100,220 C340,300 640,160 1040,240 C1240,280 1440,200 1540,230" />
        
        <!-- Large Topographic Elevation Loops -->
        <ellipse cx="720" cy="180" rx="420" ry="110" stroke="rgba(255,255,255,0.32)" />
        <ellipse cx="715" cy="185" rx="300" ry="75" stroke="rgba(255,255,255,0.38)" />
        <ellipse cx="710" cy="190" rx="180" ry="45" stroke="rgba(255,255,255,0.44)" />
        <ellipse cx="708" cy="192" rx="70" ry="20" stroke="rgba(255,255,255,0.5)" />

        <!-- Accent Sparkle Stars -->
        <path d="M320,120 L323,128 L331,131 L323,134 L320,142 L317,134 L309,131 L317,128 Z" fill="rgba(255,255,255,0.5)" stroke="none" />
        <path d="M1120,100 L1122,106 L1128,108 L1122,110 L1120,116 L1118,110 L1112,108 L1118,106 Z" fill="rgba(255,255,255,0.4)" stroke="none" />
      </svg>

      <!-- Organic Wave at the Middle -->
      <div class="laptop-wave-middle">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
          <path d="M 0,45 C 380,120 740,-25 1100,55 C 1260,90 1380,60 1440,50 L 1440,120 L 0,120 Z" fill="#ffffff"></path>
        </svg>
      </div>
    </header>

    <!-- Bottom Clean White Section -->
    <main class="laptop-white-body">
      <div class="welcome-laptop-container">
        <h1 class="welcome-laptop-title">Welcome</h1>
        <p class="welcome-laptop-desc">
          Sentinel-Trace provides integrated product genealogy, continuous compliance verification, and automated network security monitoring for modern industrial facilities.
        </p>

        <!-- Continue Action Pill -->
        <a href="login.html" class="welcome-action-pill-row">
          <span class="welcome-pill-text">Continue to Sign in</span>
          <div class="btn-circle-coral">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </a>
      </div>
    </main>
  </div>

</body>
</html>
