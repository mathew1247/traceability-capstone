<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="header-mount"></div>

      <div class="app-content">
        <div class="page-header-row">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <h1 class="page-title" style="margin: 0;">User Management</h1>
              <span class="badge badge-danger">Admin Only</span>
            </div>
            <p class="page-subtitle">Role-Based Access Control (RBAC) across Administrators, Quality Inspectors, Auditors, and Floor Operators.</p>
          </div>
          <div class="page-actions-group">
            <button class="btn btn-primary btn-sm" onclick="openModal('add-user-modal')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add User
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-search-box">
              <svg class="table-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" class="table-search-input" id="user-search" placeholder="Search user name or email..." onkeyup="filterUsers()">
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>User Profile</th>
                  <th>Email Address</th>
                  <th>Role</th>
                  <th>Account Status</th>
                  <th>Created Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <!-- Injected via users.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add User Modal -->
  <div class="modal-overlay" id="add-user-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Create New User Account</h3>
        <button class="modal-close" onclick="closeModal('add-user-modal')">&times;</button>
      </div>
      <form id="add-user-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">Full Name <span class="required">*</span></label>
              <input type="text" id="usr-name" class="form-input" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Email Address <span class="required">*</span></label>
              <input type="email" id="usr-email" class="form-input" placeholder="e.g. ramesh@sentineltrace.io" required>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">System Role</label>
              <select id="usr-role" class="form-select">
                <option value="Admin">Admin (Full Control)</option>
                <option value="Inspector">Inspector (QA & Batches)</option>
                <option value="Auditor">Auditor (Compliance & Records)</option>
                <option value="Operator">Operator (Floor Operations)</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('add-user-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
