<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Directory | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="header-mount"></div>

      <div class="app-content">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Supplier Directory</h1>
            <p class="page-subtitle">Manage approved industrial vendor profiles, quality ratings, and contact points.</p>
          </div>
          <div class="page-actions-group">
            <button class="btn btn-primary btn-sm" onclick="openModal('add-supplier-modal')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Supplier
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-search-box">
              <svg class="table-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" class="table-search-input" id="supplier-search" placeholder="Search supplier or contact..." onkeyup="filterSuppliers()">
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Supplier ID</th>
                  <th>Supplier Organization</th>
                  <th>Key Contact</th>
                  <th>Official Email</th>
                  <th>Operating Facility Address</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="suppliers-table-body">
                <!-- Injected via suppliers.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Supplier Modal -->
  <div class="modal-overlay" id="add-supplier-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Onboard Sourcing Supplier</h3>
        <button class="modal-close" onclick="closeModal('add-supplier-modal')">&times;</button>
      </div>
      <form id="add-supplier-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">Company Name <span class="required">*</span></label>
              <input type="text" id="sup-name" class="form-input" placeholder="e.g. Precision Alloys & Castings Ltd." required>
            </div>
            <div class="form-group">
              <label class="form-label">Contact Person <span class="required">*</span></label>
              <input type="text" id="sup-contact" class="form-input" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="form-group">
              <label class="form-label">Official Email <span class="required">*</span></label>
              <input type="email" id="sup-email" class="form-input" placeholder="e.g. orders@precisionalloys.com" required>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Facility Address</label>
              <input type="text" id="sup-address" class="form-input" placeholder="Industrial Corridor, Coimbatore, TN">
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Approval Status</label>
              <select id="sup-status" class="form-select">
                <option value="Verified">Verified (Tier-1)</option>
                <option value="Active">Active</option>
                <option value="Pending">Pending Audit</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('add-supplier-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/suppliers.js"></script>
</body>
</html>
