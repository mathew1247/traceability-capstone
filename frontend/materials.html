<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raw Materials | Sentinel-Trace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="header-mount"></div>

      <div class="app-content">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Raw Materials</h1>
            <p class="page-subtitle">Track incoming metallurgical heats, chemical polymers, and electronic components.</p>
          </div>
          <div class="page-actions-group">
            <button class="btn btn-primary btn-sm" onclick="openModal('add-material-modal')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Material
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-search-box">
              <svg class="table-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" class="table-search-input" id="material-search" placeholder="Search raw material or supplier..." onkeyup="filterMaterials()">
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Material ID</th>
                  <th>Material Name</th>
                  <th>Sourcing Supplier</th>
                  <th>Inventory Stock</th>
                  <th>Registration Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="materials-table-body">
                <!-- Populated via materials.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Material Modal -->
  <div class="modal-overlay" id="add-material-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Record Raw Material Inbound</h3>
        <button class="modal-close" onclick="closeModal('add-material-modal')">&times;</button>
      </div>
      <form id="add-material-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">Material Description <span class="required">*</span></label>
              <input type="text" id="mat-name" class="form-input" placeholder="e.g. Copper Alloy Bushing C86300" required>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">Approved Sourcing Supplier <span class="required">*</span></label>
              <select id="mat-supplier" class="form-select" required>
                <option value="Apex Precision Metallurgy">Apex Precision Metallurgy (Coimbatore)</option>
                <option value="Coimbatore Industrial Components">Coimbatore Industrial Components</option>
                <option value="SouthTech Materials">SouthTech Materials (Hosur)</option>
                <option value="Vanguard Polymer Systems">Vanguard Polymer Systems</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Quantity <span class="required">*</span></label>
              <input type="number" id="mat-qty" class="form-input" value="500" required>
            </div>
            <div class="form-group">
              <label class="form-label">Unit of Measure</label>
              <select id="mat-unit" class="form-select">
                <option value="kg">Kilograms (kg)</option>
                <option value="pcs">Pieces (pcs)</option>
                <option value="units">Units</option>
                <option value="liters">Liters</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('add-material-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Add Material</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/materials.js"></script>
</body>
</html>
